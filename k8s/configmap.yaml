apiVersion: v1
kind: ConfigMap
metadata:
  name: users-config
data:
  ASPNETCORE_ENVIRONMENT: "Production"
  RABBITMQ_HOST: "rabbitmq-service"
  RABBITMQ_VIRTUAL_HOST: "/"
  JWT_ISSUER: "CloudGames.Users"
  JWT_AUDIENCE: "CloudGames.Users.Client"
  MongoSettings__ConnectionString: "mongodb://mongo-service:27017"
  MongoSettings__Database: "cloudgames_users"
  Redis__ConnectionString: "redis-service:6379"
  Redis__LogStream: "cloudgames:logs"
