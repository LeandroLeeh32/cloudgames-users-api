apiVersion: v1
kind: Secret
metadata:
  name: users-secret
type: Opaque
# ATENÇÃO: valores de exemplo (placeholders). Não commitar segredos reais.
# Preencha os valores reais antes do apply, ou crie o Secret manualmente:
#   kubectl create secret generic users-secret \
#     --from-literal=RABBITMQ_USERNAME='...' \
#     --from-literal=RABBITMQ_PASSWORD='...' \
#     --from-literal=JWT_SECRET='...'
# O JWT_SECRET deve ser o MESMO usado no catalog-secret e no Kong.
# RABBITMQ_USERNAME/PASSWORD devem bater com o rabbitmq-secret.
stringData:
  RABBITMQ_USERNAME: "CHANGE_ME_RABBITMQ_USER"
  RABBITMQ_PASSWORD: "CHANGE_ME_RABBITMQ_PASSWORD"
  JWT_SECRET: "CHANGE_ME_JWT_SECRET"
